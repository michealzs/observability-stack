# Prometheus configuration. Paths are relative to this file, so the same file
# works in the container (/etc/prometheus) and under "promtool check config".

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: observability-stack

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # Fleet hosts come from targets/nodes.yml (see scripts/add-node.sh). The
  # monitoring host's own exporter is a static entry so it cannot be removed by accident.
  - job_name: node
    file_sd_configs:
      - files:
          - targets/nodes.yml
        refresh_interval: 1m
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          role: monitoring

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: promtail
    static_configs:
      - targets:
          - promtail:9080

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  # HTTP probes. Each entry in targets/http.yml becomes ?target=<url> against
  # the blackbox exporter, and the instance label keeps the probed URL.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - targets/http.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ICMP reachability for every fleet host, reusing the node target list. The
  # exporter port is stripped so the probe hits the host itself.
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - targets/nodes.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
